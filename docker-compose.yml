version: '3.8'

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: face_id_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aminov_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: face_id_redis
    restart: always
    ports:
      - "6379:6379"

  python-ai:
    build:
      context: ./python-ai
      dockerfile: Dockerfile
    container_name: face_id_python_ai
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 3

  nest-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: face_id_nest_api
    restart: always
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/aminov_db?schema=public
      - PYTHON_AI_URL=http://python-ai:5000
      - PORT=4000
    depends_on:
      postgres:
        condition: service_healthy
      python-ai:
        condition: service_healthy

volumes:
  postgres_data:
